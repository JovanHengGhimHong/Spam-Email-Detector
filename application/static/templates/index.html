<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spam Email Detector</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/static/styles/style.css" />
  </head>
  <body>
    <header class="py-3 text-center">
      <div class="container">
        <h1 class="h4 mb-0 text-white">Spam Email Detector</h1>
      </div>
    </header>

    <main class="d-flex align-items-center justify-content-center py-5">
      <div class="container" style="max-width: 640px">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <p class="text-muted text-center mb-4">
              Paste an email and submit to get a prediction.
            </p>

            <form id="predict-form" class="d-grid gap-3">
              <div>
                <label for="message" class="form-label">Email Text</label>
                <textarea
                  class="form-control"
                  id="message"
                  name="message"
                  rows="6"
                  placeholder="Enter email content..."
                  required
                ></textarea>
              </div>
              <button id="submit-btn" type="submit" class="btn btn-primary">
                Submit
              </button>
            </form>

            <div
              id="status"
              class="alert alert-info mt-3 d-none"
              role="alert"
            ></div>
          </div>
        </div>
      </div>
    </main>

    <footer class="py-3 text-center text-white-50">
      <div class="container small">
        <span>Spam Email Detector • Powered by your model</span>
      </div>
    </footer>

    <script src="/static/scripts/app.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
      integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
      crossorigin="anonymous"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
      integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
      crossorigin="anonymous"
      defer
    ></script>
  </body>
</html>
